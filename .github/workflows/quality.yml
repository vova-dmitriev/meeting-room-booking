name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  STORYBOOK_DISABLE_TELEMETRY: "1"
  VALIDATION_TEST_WORKERS: "1"

jobs:
  impact:
    name: E2E impact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      selection: ${{ steps.e2e.outputs.selection }}
      mode: ${{ steps.e2e.outputs.mode }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up locked Node tooling
        uses: ./.github/actions/setup
      - name: Select affected Playwright scenarios
        id: e2e
        run: node scripts/e2e/plan.mjs
        env:
          E2E_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

  source:
    name: Source rules and types
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up locked Node tooling
        uses: ./.github/actions/setup
      - name: Translation key parity
        run: node scripts/validation/ci.mjs i18n
      - name: TypeScript
        run: node scripts/validation/ci.mjs typecheck
      - name: ESLint
        run: node scripts/validation/ci.mjs lint
      - name: FSD boundaries
        run: node scripts/validation/ci.mjs lint:fsd
      - name: Component structure
        run: node scripts/validation/ci.mjs lint:structure
      - name: React Doctor
        run: node scripts/validation/ci.mjs lint:react
      - name: Prettier
        run: node scripts/validation/ci.mjs format:check
      - name: Unused code and dependencies
        run: node scripts/validation/ci.mjs knip

  security:
    name: Security scanners
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up locked Node tooling
        uses: ./.github/actions/setup
      - name: Install checksum-verified Gitleaks 8.30.1
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive" --output "$archive"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check -
          tar -xzf "$archive" gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Prepare the same digest-pinned Semgrep image
        run: |
          docker version
          docker pull semgrep/semgrep@sha256:81474464c1f07483ba0682a44787fd93c91397419762a04abe2bafaae396304b
      - name: Scan the complete checked-out source
        run: node scripts/validation/ci.mjs security

  unit:
    name: Unit and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up locked Node tooling
        uses: ./.github/actions/setup
      - name: Run every unit and integration spec
        run: node scripts/validation/ci.mjs unit
      - name: Upload unit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-reports
          include-hidden-files: true
          path: .superpowers/validation/reports
          retention-days: 7

  storybook:
    name: Storybook browser and accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up locked Node tooling
        uses: ./.github/actions/setup
      - name: Install Chrome and system dependencies
        run: node node_modules/@playwright/test/cli.js install --with-deps chrome
      - name: Test mobile, tablet and desktop stories
        run: node scripts/validation/ci.mjs storybook
      - name: Upload Storybook reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storybook-reports
          include-hidden-files: true
          path: .superpowers/validation/reports
          retention-days: 7

  builds:
    name: Build ${{ matrix.surface }}
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - surface: application
            command: build-application
            directory: .next
          - surface: storybook
            command: build-storybook
            directory: storybook-static
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up locked Node tooling
        uses: ./.github/actions/setup
      - name: Build the production surface
        run: node scripts/validation/ci.mjs "$BUILD_COMMAND"
        env:
          BUILD_COMMAND: ${{ matrix.command }}
      - name: Package all build files, including hidden Next artifacts
        run: tar -czf "$RUNNER_TEMP/build.tar.gz" "$BUILD_DIRECTORY"
        env:
          BUILD_DIRECTORY: ${{ matrix.directory }}
      - name: Upload the build from this workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.surface }}-build
          path: ${{ runner.temp }}/build.tar.gz
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: Affected Playwright scenarios
    needs: [impact, builds]
    if: needs.impact.outputs.mode != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      E2E_SELECTION: ${{ needs.impact.outputs.selection }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up locked Node tooling
        uses: ./.github/actions/setup
      - name: Install Chrome and system dependencies
        run: node node_modules/@playwright/test/cli.js install --with-deps chrome
      - name: Download the application from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: application-build
          path: .validation-artifacts/application
      - name: Download the Storybook from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: storybook-build
          path: .validation-artifacts/storybook
      - name: Restore both production surfaces
        run: |
          tar -xzf .validation-artifacts/application/build.tar.gz
          tar -xzf .validation-artifacts/storybook/build.tar.gz
      - name: Test isolated production servers across all viewports
        run: node scripts/validation/ci.mjs e2e
      - name: Upload E2E reports and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: affected-e2e-reports
          include-hidden-files: true
          path: |
            .superpowers/validation/reports
            test-results
          retention-days: 7

  complete-snapshot:
    needs: [impact, source, security, unit, storybook, builds, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      e2e_selection: ${{ needs.impact.outputs.selection }}
      e2e_mode: ${{ needs.impact.outputs.mode }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Require every independent job to pass
        run: node scripts/validation/ci-results.mjs
        env:
          CI_RESULTS_JSON: ${{ toJSON(needs) }}
          E2E_SELECTION: ${{ needs.impact.outputs.selection }}
          E2E_MODE: ${{ needs.impact.outputs.mode }}

  deploy:
    needs: complete-snapshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.complete-snapshot.outputs.e2e_mode != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    outputs:
      app_url: ${{ steps.app.outputs.url }}
      storybook_url: ${{ steps.storybook.outputs.url }}
    env:
      VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG }}
      VERCEL_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      STORYBOOK_DISABLE_TELEMETRY: "1"
      VALIDATION_TEST_WORKERS: "1"
    steps:
      - name: Check out validated main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the static Storybook
        run: npm run build-storybook
      - name: Deploy the Next application
        id: app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_APP_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Configure the VERCEL_TOKEN Actions secret." >&2; exit 1; }
          npx --yes vercel@65.2.0 deploy --non-interactive --prod --yes \
            --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_TEAM_SLUG" \
            --token "$VERCEL_TOKEN" --json > "$RUNNER_TEMP/app-deployment.json"
          node scripts/deployment/output.mjs "$RUNNER_TEMP/app-deployment.json" >> "$GITHUB_OUTPUT"
      - name: Deploy the Storybook
        id: storybook
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_STORYBOOK_PROJECT_ID }}
        run: |
          npx --yes vercel@65.2.0 deploy --non-interactive --cwd storybook-static --prod --yes \
            --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_TEAM_SLUG" \
            --token "$VERCEL_TOKEN" --json > "$RUNNER_TEMP/storybook-deployment.json"
          node scripts/deployment/output.mjs "$RUNNER_TEMP/storybook-deployment.json" >> "$GITHUB_OUTPUT"

  post-deploy-e2e:
    needs: [deploy, complete-snapshot]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEPLOYMENT_URL: ${{ needs.deploy.outputs.app_url }}
      STORYBOOK_DEPLOYMENT_URL: ${{ needs.deploy.outputs.storybook_url }}
      E2E_SELECTION: ${{ needs.complete-snapshot.outputs.e2e_selection }}
    steps:
      - name: Check out deployed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked browser tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chrome and system dependencies
        run: node node_modules/@playwright/test/cli.js install --with-deps chrome
      - name: Test the public application and Storybook
        run: npm run test:deployment -- --workers=1 --forbid-only --reporter=github,html
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/application
      - name: Run affected booking scenarios on the published Storybook
        run: node scripts/e2e/staging.mjs
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/business-rules
      - name: Upload browser reports and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-e2e
          path: |
            playwright-report
            test-results
