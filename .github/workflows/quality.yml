name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  STORYBOOK_DISABLE_TELEMETRY: "1"
  VALIDATION_TEST_WORKERS: "1"

jobs:
  impact:
    name: E2E impact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      selection: ${{ steps.e2e.outputs.selection }}
      mode: ${{ steps.e2e.outputs.mode }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up locked Node tooling
        uses: ./.github/actions/setup
      - name: Select affected Playwright scenarios
        id: e2e
        run: node scripts/e2e/plan.mjs
        env:
          E2E_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

  source:
    name: Source rules and types
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up locked Node tooling
        uses: ./.github/actions/setup
      - name: Translation key parity
        run: node scripts/validation/ci.mjs i18n
      - name: TypeScript
        run: node scripts/validation/ci.mjs typecheck
      - name: ESLint
        run: node scripts/validation/ci.mjs lint
      - name: FSD boundaries
        run: node scripts/validation/ci.mjs lint:fsd
      - name: Component structure
        run: node scripts/validation/ci.mjs lint:structure
      - name: React Doctor
        run: node scripts/validation/ci.mjs lint:react
      - name: Prettier
        run: node scripts/validation/ci.mjs format:check
      - name: Unused code and dependencies
        run: node scripts/validation/ci.mjs knip

  security:
    name: Security scanners
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up locked Node tooling
        uses: ./.github/actions/setup
      - name: Install checksum-verified Gitleaks 8.30.1
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive" --output "$archive"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check -
          tar -xzf "$archive" gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Prepare the same digest-pinned Semgrep image
        run: |
          docker version
          docker pull semgrep/semgrep@sha256:81474464c1f07483ba0682a44787fd93c91397419762a04abe2bafaae396304b
      - name: Scan the complete checked-out source
        run: node scripts/validation/ci.mjs security

  unit:
    name: Unit and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up locked Node tooling
        uses: ./.github/actions/setup
      - name: Run every unit and integration spec
        run: node scripts/validation/ci.mjs unit
      - name: Upload unit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-reports
          include-hidden-files: true
          path: .superpowers/validation/reports
          retention-days: 7

  storybook:
    name: Storybook browser and accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up locked Node tooling
        uses: ./.github/actions/setup
      - name: Install Chrome and system dependencies
        run: node node_modules/@playwright/test/cli.js install --with-deps chrome
      - name: Test mobile, tablet and desktop stories
        run: node scripts/validation/ci.mjs storybook
      - name: Upload Storybook reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storybook-reports
          include-hidden-files: true
          path: .superpowers/validation/reports
          retention-days: 7

  builds:
    name: Build ${{ matrix.surface }}
    environment: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'production' || 'validation' }}
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - surface: application
            command: build-application
            directory: .next
          - surface: storybook
            command: build-storybook
            directory: storybook-static
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up locked Node tooling
        uses: ./.github/actions/setup
      - name: Build the production application once
        if: matrix.surface == 'application'
        run: node scripts/deployment/build.mjs
        env:
          VERCEL_TOKEN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.VERCEL_TOKEN || '' }}
          VERCEL_APP_PROJECT_ID: ${{ vars.VERCEL_APP_PROJECT_ID }}
          VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG }}
          VERCEL_TELEMETRY_DISABLED: "1"
      - name: Build the static Storybook once
        if: matrix.surface == 'storybook'
        run: node scripts/validation/ci.mjs build-storybook
      - name: Package all tested build files without downloaded environment secrets
        run: |
          if [ "$SURFACE" = application ] && [ "$RELEASE" = "1" ]; then
            tar -czf "$RUNNER_TEMP/build.tar.gz" .next .vercel/output .vercel/project.json
          else
            tar -czf "$RUNNER_TEMP/build.tar.gz" "$BUILD_DIRECTORY"
          fi
        env:
          SURFACE: ${{ matrix.surface }}
          BUILD_DIRECTORY: ${{ matrix.directory }}
          RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && '1' || '0' }}
      - name: Upload the build from this workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.surface }}-build
          path: ${{ runner.temp }}/build.tar.gz
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: Affected Playwright scenarios
    needs: [impact, builds]
    if: needs.impact.outputs.mode != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      E2E_SELECTION: ${{ needs.impact.outputs.selection }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up locked Node tooling
        uses: ./.github/actions/setup
      - name: Install Chrome and system dependencies
        run: node node_modules/@playwright/test/cli.js install --with-deps chrome
      - name: Download the application from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: application-build
          path: .validation-artifacts/application
      - name: Download the Storybook from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: storybook-build
          path: .validation-artifacts/storybook
      - name: Restore both production surfaces
        run: |
          tar -xzf .validation-artifacts/application/build.tar.gz
          tar -xzf .validation-artifacts/storybook/build.tar.gz
      - name: Test isolated production servers across all viewports
        run: node scripts/validation/ci.mjs e2e
      - name: Upload E2E reports and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: affected-e2e-reports
          include-hidden-files: true
          path: |
            .superpowers/validation/reports
            test-results
          retention-days: 7

  visual:
    name: Visual screenshot regression
    needs: builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up locked Node tooling
        uses: ./.github/actions/setup
      - name: Download the tested Storybook artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: storybook-build
          path: .validation-artifacts/storybook
      - name: Restore Storybook
        run: tar -xzf .validation-artifacts/storybook/build.tar.gz
      - name: Compare committed screenshots
        run: npm run test:visual
      - name: Upload visual report and screenshot differences
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-reports
          path: |
            playwright-report/visual
            test-results/visual
          retention-days: 7

  complete-snapshot:
    needs: [impact, source, security, unit, storybook, builds, e2e, visual]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      e2e_selection: ${{ needs.impact.outputs.selection }}
      e2e_mode: ${{ needs.impact.outputs.mode }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Require every independent job to pass
        run: node scripts/validation/ci-results.mjs
        env:
          CI_RESULTS_JSON: ${{ toJSON(needs) }}
          E2E_SELECTION: ${{ needs.impact.outputs.selection }}
          E2E_MODE: ${{ needs.impact.outputs.mode }}

  deploy:
    needs: complete-snapshot
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.complete-snapshot.outputs.e2e_mode != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG }}
      VERCEL_APP_PROJECT_ID: ${{ vars.VERCEL_APP_PROJECT_ID }}
      VERCEL_STORYBOOK_PROJECT_ID: ${{ vars.VERCEL_STORYBOOK_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: "1"
      VERCEL_APP_BYPASS_SECRET: ${{ secrets.VERCEL_APP_BYPASS_SECRET }}
      VERCEL_STORYBOOK_BYPASS_SECRET: ${{ secrets.VERCEL_STORYBOOK_BYPASS_SECRET }}
      E2E_SELECTION: ${{ needs.complete-snapshot.outputs.e2e_selection }}
    steps:
      - name: Check out validated main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up locked browser tooling
        uses: ./.github/actions/setup
      - name: Install Chrome and system dependencies
        run: node node_modules/@playwright/test/cli.js install --with-deps chrome
      - name: Download the tested application artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: application-build
          path: .validation-artifacts/application
      - name: Download the tested Storybook artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: storybook-build
          path: .validation-artifacts/storybook
      - name: Restore the exact artifacts validated by E2E
        run: |
          tar -xzf .validation-artifacts/application/build.tar.gz
          tar -xzf .validation-artifacts/storybook/build.tar.gz
      - name: Publish candidates, verify, promote and verify production
        run: node scripts/deployment/cli.mjs release
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Recover an interrupted or failed production promotion
        if: ${{ failure() || cancelled() }}
        run: node scripts/deployment/cli.mjs rollback
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Upload release state, browser reports and failure traces
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-release
          include-hidden-files: true
          path: |
            .superpowers/release/state.json
            .superpowers/validation/reports
            playwright-report
            test-results
