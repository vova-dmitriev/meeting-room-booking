name: Locked Node tooling
description: Install the shared Node baseline and exact validation dependencies
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Install frozen dependencies
      shell: bash
      run: node scripts/validation/ci.mjs dependencies
