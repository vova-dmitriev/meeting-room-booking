rules:
  - id: rules_lgpl_javascript_ssrf_rule-node-ssrf-part-2
    mode: taint
    pattern-sources:
      - patterns:
          - focus-metavariable: $REQ
          - pattern: function ($REQ, $RES, ...) {...}
      - patterns:
          - focus-metavariable: $REQ
          - pattern: function $FUNC($REQ, $RES, ...) {...}
    pattern-sanitizers:
      - patterns:
          - pattern-either:
              - pattern: |
                  if($VALIDATION){
                  ...
                  }
              - pattern: |
                  $A = $VALIDATION
                  ...
                  if($A){
                  ...
                  }
          - metavariable-pattern:
              metavariable: $VALIDATION
              pattern-either:
                - pattern: |
                    $AL.includes(...)
                - pattern: |
                    $AL.indexOf(...) !== -1
                - pattern: |
                    $AL.find(...) !== undefined
                - pattern: |
                    $ALS.has(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: fetch($REQ,...)
                  - focus-metavariable: $REQ
                  - pattern-not: fetch(new Request(...))
              - patterns:
                  - pattern: fetch(new Request($REQ,...))
                  - focus-metavariable: $REQ
          - pattern-not-inside: |
              $REQUEST_OBJ = new Request(...)
              ...
              fetch($REQUEST_OBJ)
      - patterns:
          - pattern: new Request($REQ,...)
          - focus-metavariable: $REQ
          - pattern-inside: |
              $REQUEST_OBJ = new Request($REQ,...)
              ...
              fetch($REQUEST_OBJ)
      - patterns:
          - focus-metavariable: $REQ
          - pattern-either:
              - pattern-inside: |
                  $HTTP = require('$PKG');
                  ...
              - pattern-inside: |
                  import $HTTP from $PKG
                  ...
          - metavariable-regex:
              metavariable: $PKG
              regex: ^(http|https)$
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(get|request)$
          - pattern-either:
              - patterns:
                  - pattern: $HTTP.$METHOD($REQ, ...)
                  - pattern-not-inside: |
                      $HTTP.$METHOD({...}, ...)
                  - pattern-not-inside: |
                      $OPTS = {...}
                      ...
                      $HTTP.$METHOD($OPTS, ...)
              - pattern: |
                  $HTTP.$METHOD({..., hostname: $REQ}, ...)
              - pattern: |
                  $OPTS = {..., hostname: $REQ, ...}
                  ...
                  $HTTP.$METHOD($OPTS, ...)
              - pattern: |
                  $HTTP.$METHOD({..., host: $REQ}, ...)
              - pattern: |
                  $OPTS = {..., host: $REQ, ...}
                  ...
                  $HTTP.$METHOD($OPTS, ...)
      - patterns:
          - focus-metavariable: $REQ
          - pattern-either:
              - pattern-inside: |
                  { ..., io, ... } = require('socket.io-client');
                  ...
              - pattern-inside: |
                  import { ..., io, ... } from 'socket.io-client'
                  ...
          - pattern: io($REQ, ...)
      - patterns:
          - focus-metavariable: $HOST
          - pattern-either:
              - pattern-inside: |
                  $NET = require('net');
                  ...
              - pattern-inside: |
                  import $NET from 'net'
                  ...
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(connect|createConnection)$
          - pattern-either:
              - pattern: $NET.$METHOD($PORT, $HOST, ...)
              - pattern: |
                  $NET.$METHOD({..., host: $HOST, ...}, ...)
              - pattern: |
                  $OPTS = {..., host: $HOST, ...}
                  ...
                  $NET.$METHOD($OPTS, ...)
              - pattern: |
                  $CLIENT = new $NET.Socket()
                  ...
                  $CLIENT.$METHOD($PORT, $HOST, ...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $BENT = require('bent');
                  ...
              - pattern-inside: |
                  import $BENT from 'bent';
                  ...
          - pattern: $BENT(...)
    message: Server-side request forgery (SSRF)
    languages:
      - javascript
    severity: ERROR
    metadata:
      owasp:
        - A1:2017-Injection
        - A10:2021-Server-Side Request Forgery
        - A01:2025-Broken Access Control
      cwe: CWE-918
      shortDescription: Server-side request forgery (SSRF)
      security-severity: HIGH
      category: security
