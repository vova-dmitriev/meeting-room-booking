rules:
  - id: rules_lgpl_javascript_ssrf_rule-node-ssrf-part-1
    mode: taint
    pattern-sources:
      - patterns:
          - focus-metavariable: $REQ
          - pattern: function ($REQ, $RES, ...) {...}
      - patterns:
          - focus-metavariable: $REQ
          - pattern: function $FUNC($REQ, $RES, ...) {...}
    pattern-sanitizers:
      - patterns:
          - pattern-either:
              - pattern: |
                  if($VALIDATION){
                  ...
                  }
              - pattern: |
                  $A = $VALIDATION
                  ...
                  if($A){
                  ...
                  }
          - metavariable-pattern:
              metavariable: $VALIDATION
              pattern-either:
                - pattern: |
                    $AL.includes(...)
                - pattern: |
                    $AL.indexOf(...) !== -1
                - pattern: |
                    $AL.find(...) !== undefined
                - pattern: |
                    $ALS.has(...)
    pattern-sinks:
      - patterns:
          - focus-metavariable: $REQ
          - pattern-either:
              - pattern-inside: |
                  $NEEDLE = require('needle');
                  ...
              - pattern-inside: |
                  import $NEEDLE from 'needle'
                  ...
          - pattern-either:
              - pattern: $NEEDLE('$VERB', $REQ, ...)
              - pattern: $NEEDLE.$VERB($REQ, ...)
          - metavariable-regex:
              metavariable: $VERB
              regex: ^(get|put|post|patch|delete|head)$
      - patterns:
          - focus-metavariable: $REQ
          - pattern-either:
              - pattern-inside: |
                  $AXIOS = require('axios');
                  ...
              - pattern-inside: |
                  import $AXIOS from 'axios'
                  ...
          - pattern-either:
              - patterns:
                  - metavariable-regex:
                      metavariable: $URL
                      regex: ^(url|baseURL)$
                  - pattern-either:
                      - pattern: |
                          $AXIOS({ ..., $URL: $REQ, ...})
                      - pattern: |
                          $AXIOS.create({ ..., $URL: $REQ, ...})
              - patterns:
                  - pattern: $AXIOS.$VERB($REQ, ...)
                  - metavariable-regex:
                      metavariable: $VERB
                      regex: ^(get|put|post|patch|delete|head)$
              - patterns:
                  - pattern: axios($REQ)
                  - pattern-not-inside: axios({...})
              - pattern: |
                  axios.defaults.baseURL = $REQ
      - patterns:
          - focus-metavariable: $URL
          - pattern-either:
              - pattern-inside: |
                  {..., request, ... } = require('urllib');
                  ...
              - pattern-inside: |
                  import {..., request, ... } from 'urllib'
                  ...
          - pattern: request($URL, ...)
      - patterns:
          - focus-metavariable: $URL
          - pattern-either:
              - pattern-inside: |
                  {..., HttpClient, ... } = require('urllib');
                  ...
              - pattern-inside: |
                  import {..., HttpClient, ... } from 'urllib'
                  ...
              - pattern: |
                  $HTTPCLIENT = new HttpClient({
                                      allowH2: true,
                                    });
                  ...
                  $HTTPCLIENT.request($URL, ...)
      - patterns:
          - focus-metavariable: $URL
          - pattern-either:
              - pattern-inside: |
                  $URLLIIB = require('urllib');
                  ...
              - pattern-inside: |
                  import $URLLIIB from 'urllib'
                  ...
          - pattern: $URLLIIB.request($URL, ...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $SA = require('superagent');
                   ...
              - pattern-inside: |
                  import $SA from 'superagent'
                  ...
          - patterns:
              - pattern: $SA.$VERB(...)
              - metavariable-regex:
                  metavariable: $VERB
                  regex: ^(get|put|post|patch|delete|head)$
    message: Server-side request forgery (SSRF)
    languages:
      - javascript
    severity: ERROR
    metadata:
      owasp:
        - A1:2017-Injection
        - A10:2021-Server-Side Request Forgery
        - A01:2025-Broken Access Control
      cwe: CWE-918
      shortDescription: Server-side request forgery (SSRF)
      security-severity: HIGH
      category: security
