rules:
  - id: javascript_exec_rule-child-process
    message: Improper neutralization of special elements used in an OS command ('OS Command Injection')
    metadata:
      cwe: CWE-78
      owasp:
        - A1:2017-Injection
        - A03:2021-Injection
        - A05:2025-Injection
      shortDescription: Improper neutralization of special elements used in an OS command ('OS Command Injection')
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Nodejs_Security_Cheat_Sheet.html#do-not-use-dangerous-functions
      source-rule-url: https://github.com/nodesecurity/eslint-plugin-security/blob/master/rules/detect-child-process.js
      category: security
      technology:
        - javascript
      license: Commons Clause License Condition v1.0[LGPL-2.1-only]
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      vulnerability_class:
        - Command Injection
      security-severity: HIGH
    languages:
      - javascript
      - typescript
    severity: ERROR
    options:
      taint_unify_mvars: true
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              function ... (...,$ARG,...) {
                ...
              }
          - focus-metavariable: $ARG
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $CP = require('child_process')
                  ...
              - pattern-inside: |
                  import * as $CP from 'child_process'
                  ...
              - pattern-inside: |
                  import $CP from 'child_process'
                  ...
          - pattern-either:
              - pattern: $CP.exec($CMD,...)
              - pattern: $CP.execSync($CMD,...)
              - pattern: $CP.spawn($CMD,...)
              - pattern: $CP.spawnSync($CMD,...)
          - focus-metavariable: $CMD
    pattern-sanitizers:
      - pattern: |
          $CMD = "..."
      - pattern: |
          $CMD = ["...",...]
